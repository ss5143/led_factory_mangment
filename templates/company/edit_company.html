
{% extends "base.html" %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 700px;">
        <h2 class="mb-2">Company Settings</h2>
        <p class="text-muted">Apni invoice ki company details edit karein.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="next"
                   value="{{ request.GET.next }}">

            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ company.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ company.phone }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control"
                          rows="3" required>{{ company.address }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ company.email }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Website</label>
                <input type="text" name="website" class="form-control"
                       value="{{ company.website }}">
            </div>

            {% if company.logo %}
                <div class="mb-3">
                    <label class="form-label">Current Logo</label><br>
                    <img src="{{ company.logo.url }}" alt="Company Logo"
                         style="max-width: 150px; max-height: 100px; object-fit: contain;">
                </div>
            {% endif %}

            <div class="mb-4">
                <label class="form-label">Change Logo</label>
                <input type="file" name="logo" class="form-control"
                       accept="image/*">
            </div>

            <button type="submit" class="btn btn-success">
                Save Company Details
            </button>

            <a href="/" class="btn btn-secondary ms-2">Back</a>
        </form>
    </div>
</div>
{% endblock %}
