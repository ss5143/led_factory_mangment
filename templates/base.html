
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Factory </title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">

</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-lg-2 sidebar">

    <div class="text-center mb-4">
        <h2 class="logo">💡 LED Bulb</h2>

        <img src="https://ui-avatars.com/api/?name={{request.user.username}}&background=16a34a&color=fff"
             class="profile-img">

        <h5 class="mt-3">{{ request.user.username }}</h5>

        <small class="text-success">● Online</small>
    </div>

    <hr>

    <a href="/" class="menu-link">
        <i class="bi bi-house-door-fill"></i>
        Dashboard
    </a>

    <a href="/add-product/" class="menu-link">
        <i class="bi bi-box-seam"></i>
        Products
    </a>

    <a href="/orders/" class="menu-link">
        <i class="bi bi-cart-check"></i>
        Orders
    </a>

    <a href="/add-purchase/" class="menu-link">
        <i class="bi bi-truck"></i>
        Purchases
    </a>

    <a href="/customers/" class="menu-link">
        <i class="bi bi-people-fill"></i>
        Customers
    </a>

    <a href="/suppliers/" class="menu-link">
        <i class="bi bi-building"></i>
        Suppliers
    </a>

    <a href="/reports/" class="menu-link">
        <i class="bi bi-bar-chart-line"></i>
        Reports
    </a>

    <hr>

    <a href="/logout/" class="menu-link logout">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </a>

</div>

        <!-- Main Content -->
        <div class="col-lg-10 col-md-9 p-4">
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded mb-4">
                <div class="container-fluid">

                    <span class="navbar-brand welcome-user"> 
                        👤 Welcome, {{ request.user.username }}
                    </span>

                    <div class="ms-auto">

                        <a href="/" class="btn btn-outline-primary me-2">
                            Dashboard
                        </a>

                        <a href="/add-product/" class="btn btn-success me-2">
                            Add Product
                        </a>

                        <a href="/add-order/" class="btn btn-warning me-2">
                            New Sale
                        </a>

                        <a href="/reports/" class="btn btn-info me-2">
                            Reports
                        </a>

                        <a href="/logout/" class="btn btn-danger">
                            Logout
                        </a>

                    </div>

                </div>
            </nav>

            {% block content %}
            {% endblock %}

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
